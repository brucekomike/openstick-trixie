# extlinux.conf for the Handsome OpenStick UFI103s.
# Kept in the builder's own key format (see vendor/dts/builder-extlinux.conf), with two
# deliberate differences: the fdt line points at THIS board's extracted stock DTB, and the
# root PARTUUID is the one measured from /proc/cmdline on this device.
#
# Why the fdt line matters: the builder's default is qcom/msm8916-yiming-uz801v3.dtb, and the
# "UFI001B/C -> thwc-ufi001c.dtb -> supported" row is a *different board* (single external SIM
# slot on gpio0-3). This stick has dual-SIM switching (sim_sel/sim_en/sim_sel2/sim_en2), so a
# borrowed DTB risks driving the SIM mux wrong. dtb0.dtb is this board's own description.
#
# The boot chain here is already lk2nd + qhypstub (proved by strings on backup/part-aboot.bin
# and backup/part-hyp.bin), which is what reads this file.

LABEL OpenStick-UFI103s
  KERNEL /vmlinuz
  INITRD /initrd
  FDT /dtbs/qcom/msm8916-handsome-openstick.dtb
  APPEND earlycon root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e console=ttyMSM0,115200 no_framebuffer=true rw rootwait
