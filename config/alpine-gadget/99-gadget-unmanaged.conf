# usb0 belongs to gadget-net-up.sh: it gets a static address and its own dnsmasq, so
# NetworkManager must not claim it (that fight is what left the interface DOWN and the
# host NO-CARRIER on the first Alpine boot). wlan0 stays managed - it is the Wi-Fi door.
[keyfile]
unmanaged-devices=interface-name:usb0;interface-name:ncm0
